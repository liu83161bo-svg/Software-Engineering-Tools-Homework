stages:
  generate_data:
    cmd: python data/generate_data.py
    deps:
      - data/generate_data.py
    outs:
      - data/raw/sample_eeg_data.csv
      - data/processed/sample_eeg_data.jsonl
    metrics:
      - data/raw/data_metrics.json:
          cache: false

  create_splits:
    cmd: python data/create_splits.py
    deps:
      - data/create_splits.py
      - data/raw/sample_eeg_data.csv
    outs:
      - data/splits/train_subjects.txt
      - data/splits/val_subjects.txt
      - data/splits/test_subjects.txt
      - data/splits/split_metadata.json

  validate_data:
    cmd: python tests/test_data_checks.py
    deps:
      - tests/test_data_checks.py
      - data/raw/sample_eeg_data.csv
      - data/processed/sample_eeg_data.jsonl
      - data/splits/
    metrics:
      - reports/data_validation_report.json:
          cache: false