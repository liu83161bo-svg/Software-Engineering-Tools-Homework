# .github/workflows/ci.yml
name: Software-Engineering-Tools-Homework

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for DVC
            
      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy dvc
          
      - name: Initialize DVC
        run: |
          dvc init --no-scm
          # Use local cache (since we're using git-committed .dvc files)
          dvc config core.autostage true
          
      - name: Pull Data from DVC
        run: |
          # Pull data using DVC (from committed .dvc files)
          echo "Pulling data files from DVC cache..."
          dvc pull data/sample_eeg_data.csv.dvc data/sample_eeg_data.jsonl.dvc || echo "DVC pull completed"
          
          # Verify files exist
          ls -la data/
          
      - name: Generate Sample Data (if DVC fails)
        if: failure()
        run: |
          echo "Generating sample data locally..."
          python data/generate_sample_data.py
          python data/create_splits.py
          
      - name: Create Data Splits
        run: |
          python data/create_splits.py
          
      - name: Run Data Quality Checks
        run: |
          echo "Running comprehensive data quality checks..."
          python tests/test_data_checks.py
          
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: |
            data/splits/
            reports/
