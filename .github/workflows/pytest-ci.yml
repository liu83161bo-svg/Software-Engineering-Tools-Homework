name: Software-Engineering-Tools-Homework

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out code
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy
      
      # Step 4: Generate sample data (instead of pulling from DVC)
      - name: Generate Sample Data (instead of pulling from DVC)
        run: |
          echo "Generating sample data for CI..."
          cd data
          python generate_sample_data.py
          python create_splits.py
      
      # Step 5: Run data quality checks
      - name: Run Data Quality Checks
        run: |
          echo "Running data quality checks..."
          python tests/test_data_checks.py
      
      # Step 6: Create test reports directory
      - name: Create Reports Directory
        run: mkdir -p reports
      
      # Step 7: Upload artifacts
      - name: Upload Data Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: |
            data/sample_eeg_data.csv
            data/splits/
